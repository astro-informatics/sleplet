---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@002ff6bbed5977dcc80a29d2a82b31559ac386de # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@002ff6bbed5977dcc80a29d2a82b31559ac386de # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
