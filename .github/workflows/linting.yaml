---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@67a4ca698e2e983c8a2edd3a970c7a297598b7dd # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@67a4ca698e2e983c8a2edd3a970c7a297598b7dd # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
